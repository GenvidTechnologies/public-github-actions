name: Node Gate

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run (non-failing)"
        type: boolean
        default: false
      submodules:
        description: "Passed through to actions/checkout `submodules` (e.g. 'recursive' to init git submodules; '' = none)"
        type: string
        default: ""
      extra-env:
        description: "Extra env vars for the gate's later steps: newline-separated KEY=VALUE lines, written to $GITHUB_ENV after checkout. '' = none."
        type: string
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
      # A caller's `env:` does not reach a called workflow, so callers pass env vars through this input.
      # The value reaches the script only via `env:` (never interpolated into `run:`).
      - if: inputs.extra-env != ''
        name: Export caller env
        shell: bash
        env:
          GATE_ENV: ${{ inputs.extra-env }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            [ -z "$line" ] && continue
            key=${line%%=*}
            if [ "$key" = "$line" ] || [ -z "$key" ] || [ -n "${key//[A-Za-z0-9_]/}" ]; then
              echo "::error::extra-env line is not KEY=VALUE: $line"; exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
            echo "exported $key"
          done <<< "$GATE_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - if: inputs.dry-run
        run: npm publish --dry-run --access public
        continue-on-error: true
